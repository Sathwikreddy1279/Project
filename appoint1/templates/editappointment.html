    <form id='f1' method="POST">
        {% csrf_token %}
        <table border='2' align='center'>

                <td class='exstyle'>Appointment Id</td>
                <td>
                    <input type='text' readonly id='appoint_id' name='appoint_id' value="{{appointments.appoint_id}}"/>
                </td>
            </tr>
            <tr>
                <td class='exstyle'>Doctor Name</td>
                <td>
                    <input type='text' id='fn' name='fn' value="{{appointments.dname}}"/>

            <tr>
                <td class='exstyle'>Appointment Date</td>
                <td>

                </td>
            </tr>
            <tr>
                <td class='exstyle'>Appointment Time</td>
                <td>
                    <input type='text' id='time' name='time' value="{{appointments.appointment_time}}"/>

            <tr>

                <td>
                    <input type='text' id='name' name='name' value="{{appointments.pname}}"/>

            </tr>

                <td>
                    <input type='submit' id='b1' name='b1' value='Update'/>

                </td>
