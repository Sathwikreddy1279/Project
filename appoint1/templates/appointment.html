 <!-- Navbar Start -->
 <div class="container-fluid sticky-top bg-white shadow-sm">

    <!-- Appointment Start -->
    <div class="container-fluid py-5">
        <div class="container">
            <div class="row gx-5">
                <div class="col-lg-6 mb-5 mb-lg-0">
                    <div class="mb-4">
                        <h5 class="d-inline-block text-primary text-uppercase border-bottom border-5">Appointment</h5>
                        <h1 class="display-4">Make An Appointment For Your Family</h1>
                    </div>
                    <p class="mb-5"></p>
                    <a class="btn btn-primary rounded-pill py-3 px-5 me-3" href="{%url 'team'%}">Find Doctor</a>
                    <a class="btn btn-outline-primary rounded-pill py-3 px-5" href="">Read More</a>
                </div>
                <div class="col-lg-6">
                    <div class="bg-light text-center rounded p-5">
                        <h1 class="mb-4">Book An Appointment</h1> 
                         <form action="#"  method="post">
                            {%csrf_token%}
                            <div class="row g-3">
                                <div class="col-12 col-sm-6">
                                    <input type="text" class="form-control bg-white border-0" id="pid" name="pid" placeholder=" Patient Id" style="height: 55px;">
                                </div>   
                                <div class="col-12 col-sm-6">
                                    <select   id="did" name="did"class="form-select bg-white border-0" style="height: 55px;">
                                        <option selected>Select Doctor Id</option>
                                        <option value=" 1"> (did-1)T.Prashanth-Critical care specialist</option>
                                        <option value=" 2"> (did-2)S.M.Waseem Ahmed-orthopedic</option>
                                        <option value=" 3">(did-3)b.Vishanth-critical care specialist </option>
                                        <option value=" 4">(did-4) V.Madhuri-gynecologist</option>
                                        <option value=" 5">(did-5)A.Ravikumar-General physician </option>
                                    </select>
                                </div>                                

                                <div class="col-12 col-sm-6">
                                    <select    id="speciality" name="speciality"class="form-select bg-white border-0" style="height: 55px;">
                                        <option selected>Speciality</option>
                                        <option value="critical care specialist">critical care specialist</option>
                                        <option value=" Orthopedic"> Orthopedic</option>
                                        <option value="Gynecologist">Gynecologist</option>
                                        <option value="General Physician">General Physician</option>
                                        <option value="others"> others</option>
                                    </select>
                                </div>
                    
                                <div class="col-12 col-sm-6">
                                    <select   id="doctor" name="doctor"class="form-select bg-white border-0" style="height: 55px;">
                                        <option selected>Select Doctor</option>
                                        <option value=" T.Prashanth"> T.Prashanth-Critical care specialist</option>
                                        <option value="S.M.Waseem Ahmed"> S.M.Waseem Ahmed-orthopedic</option>
                                        <option value="b.Vishanth">b.Vishanth-critical care specialist </option>
                                        <option value=" V.Madhuri"> V.Madhuri-gynecologist</option>
                                        <option value="A.Ravikumar">A.Ravikumar-General physician </option>
                                    </select>
                                </div>

                                <div class="col-12 col-sm-6">
                                    <input type="text" class="form-control bg-white border-0" id="name" name="name" placeholder="Your Name" style="height: 55px;">
                                </div>

                             
                                <div class="col-12 col-sm-6">
                                    <input type="email" class="form-control bg-white border-0" name="email" placeholder="Your Email" style="height: 55px;">
                                </div>
                                <div class="col-12 col-sm-6">
                                    <div class="date" data-target-input="nearest">
                                        <input type="date"
                                            class="form-control bg-white border-0 datetimepicker-input"
                                            name="date"
                                            placeholder="Date" data-target="#date" data-toggle="datetimepicker" style="height: 55px;">
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <div class="time"  data-target-input="nearest">
                                        <input type="time"
                                            class="form-control bg-white border-0 datetimepicker-input" name="time"
                                            placeholder="Time" data-target="#time" data-toggle="datetimepicker" style="height: 55px;">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <button class="btn btn-primary w-100 py-3" type="submit">Make An Appointment</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Appointment End -->


    


    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>

    <script src="js/main.js"></script>
